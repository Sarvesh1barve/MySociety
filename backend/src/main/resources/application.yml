server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/mysociety}
    username: ${SPRING_DATASOURCE_USERNAME:mysociety}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
app:
  jwt-secret: ${JWT_SECRET}
  cors-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  seed-demo: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
