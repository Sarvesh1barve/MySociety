name: Verify application
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: mysociety_test
          POSTGRES_USER: mysociety
          POSTGRES_PASSWORD: ci-ephemeral-database-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mysociety -d mysociety_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mysociety_test
      SPRING_DATASOURCE_USERNAME: mysociety
      SPRING_DATASOURCE_PASSWORD: ci-ephemeral-database-only
      TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/mysociety_test
      JWT_SECRET: ci-temporary-key-for-isolated-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend integration tests and package
        working-directory: backend
        run: bash mvnw --batch-mode verify
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
